<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bolsa 1927–1933: Simulador da Grande Depressão</title>
<style>
:root{--bg:#f6f3ec;--card:#fff;--tx:#1f1d1a;--mut:#6b665d;--bd:#ddd6c8;--ac:#1d5c4a;--up:#1d7a46;--dn:#b3261e;--warn:#fff1d6;--wtx:#6b4400;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171613;--card:#23211d;--tx:#f0ece2;--mut:#a39d90;--bd:#3a372f;--ac:#5fc4a2;--up:#5fd08a;--dn:#ff8a80;--warn:#3d3118;--wtx:#ffd98a}}
:root[data-theme="dark"]{--bg:#171613;--card:#23211d;--tx:#f0ece2;--mut:#a39d90;--bd:#3a372f;--ac:#5fc4a2;--up:#5fd08a;--dn:#ff8a80;--warn:#3d3118;--wtx:#ffd98a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Georgia,"Times New Roman",serif}
main{max-width:620px;margin:0 auto;padding:12px}
.hd{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px}
.date{font-size:20px;font-weight:bold}
.nw{font-size:13px;color:var(--mut);text-align:right}
.nw b{font-size:18px;color:var(--tx);display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
h2{font-size:15px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.news{background:var(--warn);color:var(--wtx);border-color:transparent}
.news.bad{border-left:4px solid var(--dn)}
button{font:inherit;border:1px solid var(--ac);background:transparent;color:var(--ac);border-radius:8px;padding:6px 10px;cursor:pointer}
button.pri{background:var(--ac);color:var(--bg);font-weight:bold;padding:10px 14px}
button:disabled{opacity:.4}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.nm{flex:1;min-width:0}.nm small{color:var(--mut);display:block}
.up{color:var(--up)}.dn{color:var(--dn)}
.btns{display:flex;gap:4px}
.seg button{margin-right:4px}.seg button.on{background:var(--ac);color:var(--bg)}
label{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:14px}
.mut{color:var(--mut);font-size:13px}
svg{width:100%;height:auto;display:block}
ul{padding-left:18px;margin:6px 0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

.tag{font-size:12px;background:var(--ac);color:var(--bg);border-radius:10px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.me{font-weight:bold;color:var(--ac)}
</style>
</head>
<body>
<main>
<div class="hd"><div><span class="date" id="date"></span><span class="tag" id="who"></span></div><div class="nw" id="nw"></div></div>
<div class="card news" id="news"></div>
<div id="app"></div>
</main>
<script>
const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const N=84, START=1000;
const STK=[{n:"Rádio Nova",d:"Tecnologia da época",b:1.4},{n:"Automóveis Titan",d:"Carros para todos",b:1.2},{n:"Aço Nacional",d:"Indústria pesada",b:1.0},{n:"Serviços Elétricos Unidos",d:"Eletricidade",b:1.1},{n:"Ferrovias Atlântico",d:"Caminhos de ferro",b:0.8}];
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function drift(t){const ym=(1927+Math.floor(t/12))*100+t%12+1;
 if(ym<=192908)return .028; if(ym==192909)return .01; if(ym==192910)return -.22; if(ym==192911)return -.2; if(ym==192912)return .03;
 if(ym<=193004)return .04; if(ym<=193206)return -.06; if(ym<=193302)return .04; if(ym<=193307)return .10; return -.01}
const R=rng(1929), P=STK.map((s,i)=>{const a=[10+i*4];for(let t=1;t<N;t++){const g=drift(t)*s.b+(R()-.5)*.07;a.push(Math.max(.4,a[t-1]*(1+g)))}return a});
const IDX=[...Array(N)].map((_,t)=>100*P.reduce((s,a,i)=>s+a[t]/a[0],0)/STK.length);
const EV={
192701:["Janeiro de 1927. A economia americana vive os “loucos anos 20”: fábricas, rádio e automóveis em expansão. Tens $1000 fictícios. Podes investir em ações, depositar no Banco Progresso, ou comprar a crédito (margem).","Aprende: ações sobem quando as pessoas acreditam que as empresas vão crescer."],
192801:["A euforia espalha-se. Até taxistas e engraxadores dão “dicas” de ações. Muitos compram a margem: pagam só uma parte e pedem o resto emprestado ao corretor.","Aprende: o crédito amplifica ganhos… e perdas."],
192906:["Os preços das ações estão muito acima do lucro real das empresas. Alguns economistas avisam de uma bolha, mas ninguém quer ouvir.","Aprende: uma bolha é quando o preço se descola do valor real."],
192909:["Setembro de 1929: pico da bolsa. Tudo parece seguro.","Aprende: ninguém sabe quando é o topo, só se percebe depois."],
192910:["24 e 29 de outubro: Quinta-feira Negra e Terça-feira Negra. Pânico! Milhões de ações são vendidas a qualquer preço. Quem comprou a margem recebe chamadas de margem e é obrigado a vender. Circulam rumores de que o Banco Progresso tem problemas: há filas à porta e o banco congelou os levantamentos. O dinheiro dos depositantes fica congelado!","Aprende: vendas forçadas fazem os preços cair ainda mais — um círculo vicioso."],
192911:["Novembro de 1929: corrida aos bancos! O Banco Progresso fecha as portas e não há seguro de depósitos. Quem lá tinha dinheiro perdeu tudo. A queda da bolsa continua.","Aprende: sem seguro de depósitos, uma corrida ao banco pode destruir a poupança de uma vida."],
192912:["Um pequeno alívio. Muitos acham que a crise acabou.","Aprende: as quedas costumam ter rallies falsos pelo meio."],
193004:["Abril de 1930: “O pior já passou”, dizem políticos e empresários. A bolsa recuperou bastante.","Aprende: cuidado com quem diz que “agora é que é a altura de comprar”."],
193005:["Maio de 1930: começa a longa queda. As empresas cortam produção e despedem. Sem emprego, as pessoas gastam menos, o que prejudica ainda mais as empresas.","Aprende: a crise na bolsa passa para a economia real."],
193010:["Seca no centro dos EUA, desemprego a subir, bancos com maus empréstimos. Os clientes começam a ter medo.","Aprende: os bancos emprestam parte dos depósitos, não guardam tudo no cofre."],
193011:["Novembro de 1930: a crise bancária alastra e centenas de bancos já fecharam em todo o país.","Aprende: uma falência bancária espalha o medo e arrasta outros bancos."],
193012:["Dezembro de 1930: falência de um grande banco. Milhares de bancos falirão até 1933 e quem tinha depósitos perdeu tudo.","Aprende: sem seguro de depósitos, uma corrida ao banco pode destruir a poupança de uma vida."],
193106:["Desemprego perto dos 15%. Filas para a sopa dos pobres. Os preços e salários descem (deflação), e as dívidas ficam mais difíceis de pagar.","Aprende: a deflação torna as dívidas mais pesadas."],
193207:["Julho de 1932: mínimo da bolsa, cerca de 89% abaixo do pico. O desemprego ronda os 25%.","Aprende: quem vendeu em pânico fixou perdas; quem esperou ainda demorou 25 anos a recuperar o nível de 1929."],
193303:["Março de 1933: Roosevelt assume e declara um “feriado bancário”. Mais tarde cria o seguro de depósitos (FDIC) e regras para a bolsa. Os bancos reabrem com garantia do Estado.","Aprende: regulação e confiança foram a base da recuperação."],
193312:["Dezembro de 1933: fim da simulação.","Vê o teu resultado abaixo."]
};
const dateOf=t=>MES[t%12]+" "+(1927+Math.floor(t/12));
const ymOf=t=>(1927+Math.floor(t/12))*100+t%12+1;
const O=()=>{const y=ymOf(S.t);return !(y>=192911&&y<193303)};
const SAVE=["t","cash","sh","bank","loan","od","hist","peak","peakT","round","joined"];
let S,G={t:0,round:0},db=null,user=null,me=null,ADMIN=false,SPEC=false,PL=[],st;
const fresh=(round,joined)=>({t:0,cash:START,sh:STK.map(()=>0),bank:0,loan:0,od:0,qty:5,margin:false,hist:[START],msg:null,bad:false,end:false,peak:START,peakT:0,round:round||0,joined:joined||Date.now(),user:null,teach:false});
function init(){S=fresh(G.round);show(0)}
const $=id=>document.getElementById(id);
const f=n=>(n<0?"-":"")+"$"+Math.abs(Math.round(n)).toLocaleString("pt-PT");
const f2=n=>"$"+n.toFixed(2).replace(".",",");
const stockVal=()=>S.sh.reduce((s,q,i)=>s+q*P[i][S.t],0);
const nw=()=>S.cash+S.bank+stockVal()-S.loan-S.od;
function show(t){S.msg=EV[ymOf(t)]||null}
function save(){if(!db||SPEC)return;clearTimeout(st);st=setTimeout(()=>{const o={};SAVE.forEach(k=>o[k]=S[k]);o.nw=nw();db.doc("players/"+me).set(o).catch(()=>{})},250)}
function upd(){draw();save()}
const sorted=()=>[...PL].sort((x,y)=>(x.joined-y.joined)||(x.id<y.id?-1:1));
const rank=()=>{const i=sorted().findIndex(p=>p.id===me);return i<0?PL.length+1:i+1};
function buy(i){if(SPEC)return;const c=S.qty*P[i][S.t];const need=S.margin?c*.2:c;
 if(S.cash<need){flash("Dinheiro insuficiente"+(S.margin?" (precisas de 20% do valor)":""));return}
 S.cash-=need;if(S.margin)S.loan+=c-need;S.sh[i]+=S.qty;upd()}
function sell(i){if(SPEC)return;const q=Math.min(S.qty,S.sh[i]);if(!q)return;let p=q*P[i][S.t];S.sh[i]-=q;const r=Math.min(S.loan,p);S.loan-=r;S.cash+=p-r;upd()}
function dep(a){if(FR()){flash("O banco está com problemas e não aceita novos depósitos.");return}a=a==="all"?S.cash:a;a=Math.min(a,S.cash);if(SPEC||a<=0||!O())return;S.cash-=a;S.bank+=a;upd()}
const FR=()=>ymOf(S.t)==192910;
function wd(a){if(FR()&&S.bank>0){flash("O banco congelou os levantamentos: o teu dinheiro fica congelado.");return}a=a==="all"?S.bank:a;a=Math.min(a,S.bank);if(SPEC||a<=0||!O())return;S.bank-=a;S.cash+=a;upd()}
function borrow(a){if(FR()){flash("O banco está com problemas e não concede empréstimos.");return}if(SPEC||!O())return;if(S.od+a>2000){flash("O banco não te empresta mais: o limite é $2000 em empréstimos a descoberto.");return}S.od+=a;S.cash+=a;upd()}
function repay(a){a=a==="all"?Math.min(S.od,S.cash):Math.min(a,S.od,S.cash);if(SPEC||a<=0)return;S.od-=a;S.cash-=a;upd()}
function flash(m){S.flash=m;draw()}
function step(al){
 S.t++;const ym=ymOf(S.t);
 S.bank*=1.0025;S.loan*=1.007;S.od*=1.01;
 if(ym==192911&&S.bank>0){al.push("O Banco Progresso faliu! Perdeste "+f(S.bank)+" que tinhas depositados.");S.bank=0}
 const sv=stockVal();
 if(S.loan>0&&S.loan>sv*.75){const p=sv-S.loan;al.push("CHAMADA DE MARGEM! O corretor vendeu todas as tuas ações para cobrir o empréstimo."+(p<0?" Ficaste a dever "+f(-p)+".":" Sobraram-te "+f(p)+"."));S.cash+=p;S.sh=STK.map(()=>0);S.loan=0}
 const v=nw();S.hist.push(v);if(v>S.peak){S.peak=v;S.peakT=S.t}
}
function catchUp(){
 if(S.t<G.t){const al=[];S.flash=null;while(S.t<G.t&&S.t<N-1)step(al);show(S.t);
  S.bad=[192910,192911,192912,193012,193207].includes(ymOf(S.t));
  if(al.length){S.msg=[al.join(" "),S.msg?S.msg[1]:"Aprende: comprar a crédito é perigoso quando o mercado cai."];S.bad=true}
  window.scrollTo(0,0);save()}
 S.end=S.t>=N-1;draw()}
function next(){
 if(db){if(!ADMIN)return;db.doc("game/state").set({t:Math.min(G.t+1,N-1),round:G.round}).catch(()=>{})}
 else{G.t=Math.min(G.t+1,N-1);catchUp()}}
function resetAll(){if(!confirm("Reiniciar o jogo para todos os utilizadores?"))return;
 db.doc("game/state").set({t:0,round:G.round+1}).catch(()=>{})}
function again(){const u=S.user;G={t:0,round:G.round};init();S.user=u;draw()}
function chart(){const W=300,H=110;const a=S.hist.map(v=>v/START*100),b=IDX.slice(0,S.t+1);
 const mx=Math.max(120,...a,...b)*1.05;const X=i=>6+i*(W-12)/(N-1),Y=v=>H-6-v/mx*(H-12);
 const pl=(arr,c)=>`<polyline fill="none" stroke="${c}" stroke-width="2" points="${arr.map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ")}"/>`;
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico do índice de bolsa e do teu património">
<line x1="6" x2="294" y1="${Y(100)}" y2="${Y(100)}" stroke="var(--bd)" stroke-dasharray="3 3"/>
${pl(b,"var(--dn)")}${pl(a,"var(--ac)")}</svg>
<div class="mut"><span style="color:var(--dn)">━</span> Índice da bolsa &nbsp; <span style="color:var(--ac)">━</span> O teu património (base 100 = início)</div>`}
function board(){if(!db)return"";const s=sorted().slice(0,12).map((p,i)=>({n:i+1,p}));s.sort((x,y)=>(y.p.nw||0)-(x.p.nw||0));
 return `<div class="card"><h2>Classificação (${s.length}/12 investidores)</h2>${s.map((x,i)=>`<div class="row"><div class="nm ${x.p.id===me?"me":""}">${i+1}. Utilizador ${x.n}${x.p.id===me?" (tu)":""}<small>${dateOf(Math.min(x.p.t||0,N-1))}</small></div><b class="${(x.p.nw||0)>=START?"up":"dn"}">${f(x.p.nw||0)}</b></div>`).join("")||'<div class="mut">Ainda ninguém entrou.</div>'}</div>`}
function ctrl(){
 if(!db)return `<div style="text-align:center;margin:14px 0"><button class="pri" onclick="next()">Avançar um mês →</button><div class="mut" style="margin-top:6px">Mês ${S.t+1} de ${N} · modo individual</div></div>`;
 return `<div style="text-align:center;margin:14px 0">${ADMIN?`<button class="pri" onclick="next()" ${G.t>=N-1?"disabled":""}>Avançar um mês (todos) →</button> <button onclick="resetAll()">Reiniciar jogo</button>`:`<div class="mut"><b>A aguardar que o professor avance o mês…</b></div>`}<div class="mut" style="margin-top:6px">Mês ${G.t+1} de ${N}</div></div>`}
function draw(){
 $("date").textContent=dateOf(S.t);
 $("who").textContent=S.user?"Utilizador "+S.user:"";$("who").style.display=S.user?"":"none";
 const v=nw();$("nw").innerHTML=`Património<b>${f(v)}</b>`;
 const n=$("news");
 if(S.flash){n.className="card news bad";n.innerHTML=S.flash}
 else if(S.msg){n.className="card news"+(S.bad?" bad":"");n.innerHTML=`<div>${S.msg[0]}</div><div class="mut" style="margin-top:6px;color:inherit"><b>${S.msg[1]}</b></div>`}
 else{n.className="card news"+(S.bad?" bad":"");n.innerHTML=`Mais um mês passou. Acompanha o mercado e decide.`}
 if(S.teach){$("app").innerHTML=panel();return}
 if(!S.user){$("app").innerHTML=picker();return}
 if(S.end){$("app").innerHTML=endView();return}
 let h=`<div class="card"><h2>Evolução</h2>${chart()}</div>`;
 if(SPEC)h=`<div class="card news">Já há 12 investidores neste jogo. Estás só a assistir.</div>`+h;
 h+=`<div class="card"><h2>Mercado de ações</h2>
<div class="seg">Quantidade: ${[1,5,10,25].map(q=>`<button class="${S.qty==q?"on":""}" onclick="S.qty=${q};draw()">${q}</button>`).join("")}</div>
<label><input type="checkbox" ${S.margin?"checked":""} onchange="S.margin=this.checked;draw()"> Comprar a crédito (margem): pago só 20%, peço emprestado 80% a 8%/ano</label>`;
 STK.forEach((s,i)=>{const p=P[i][S.t],pp=S.t?P[i][S.t-1]:p,c=(p/pp-1)*100;
  h+=`<div class="row"><div class="nm"><b>${s.n}</b><small>${s.d} · tens ${S.sh[i]}</small></div><div style="text-align:right"><b>${f2(p)}</b><br><small class="${c>=0?"up":"dn"}">${c>=0?"▲":"▼"} ${Math.abs(c).toFixed(1).replace(".",",")}%</small></div><div class="btns"><button onclick="buy(${i})">Comprar</button><button onclick="sell(${i})" ${S.sh[i]?"":"disabled"}>Vender</button></div></div>`});
 h+=`</div>`;
 h+=`<div class="card"><h2>Banco Progresso</h2>
<div class="row"><div>Disponível<br><b>${f(S.cash)}</b></div><div>No banco<br><b>${f(S.bank)}</b></div><div>Dív. margem<br><b class="${S.loan?"dn":""}">${f(S.loan)}</b></div><div>Descoberto<br><b class="${S.od?"dn":""}">${f(S.od)}</b></div></div>
${O()?`<div class="bar"><button onclick="dep(100)">Depositar $100</button><button onclick="dep('all')">Depositar tudo</button><button onclick="wd(100)">Levantar $100</button><button onclick="wd('all')">Levantar tudo</button></div><div class="bar"><button onclick="borrow(100)">Pedir $100 a descoberto</button><button onclick="borrow(500)">Pedir $500</button><button onclick="repay(100)" ${S.od?"":"disabled"}>Pagar $100</button><button onclick="repay('all')" ${S.od?"":"disabled"}>Pagar tudo</button></div><div class="mut" style="margin-top:6px">Juros de 3% ao ano nos depósitos. Descoberto: 12%/ano, limite $2000, sem garantia. ${ymOf(S.t)>=193303?"Depósitos agora garantidos pelo Estado.":"Sem seguro de depósitos."}</div>`:`<div class="mut"><b class="dn">O banco está fechado.</b> Reabre em março de 1933.</div>`}</div>`;
 h+=board()+ctrl();
 $("app").innerHTML=h}
function endView(){const v=nw(),r=(v/START-1)*100;
 return `<div class="card"><h2>Resultado final</h2><div style="font-size:26px;font-weight:bold">${f(v)}</div><div class="${r>=0?"up":"dn"}">${r>=0?"+":""}${r.toFixed(0)}% face aos $1000 iniciais</div>${v<0?`<p class="dn"><b>Faliste: ficaste com dívidas superiores ao que tens.</b> Foi o destino de muitos investidores em 1929.</p>`:""}<p class="mut">Máximo atingido: ${f(S.peak)} em ${dateOf(S.peakT)}.</p>${chart()}</div>
<div class="card"><h2>O teu código para o professor</h2><div style="font-size:24px;font-weight:bold">U${S.user}:${Math.round(v)}</div><div class="mut">Mostra ou envia este código ao professor para entrar na classificação da turma.</div></div>
<div class="card"><h2>O que aconteceu na história</h2><ul>
<li>A bolsa perdeu cerca de 89% entre 1929 e 1932.</li>
<li>Milhares de bancos faliram e as poupanças desapareceram.</li>
<li>O desemprego chegou a cerca de 25% nos EUA.</li>
<li>Em 1933 criou-se o seguro de depósitos (FDIC) e regras para a bolsa.</li></ul>
<h2 style="margin-top:12px">Lições</h2><ul>
<li>As bolhas parecem seguras enquanto crescem.</li>
<li>O crédito (margem) amplifica perdas e causa vendas forçadas.</li>
<li>Diversificar e não depender de dívida protege-te.</li>
<li>A confiança no sistema financeiro é essencial.</li></ul></div>
${!db||ADMIN?`<div style="text-align:center"><button class="pri" onclick="again()">Jogar outra vez</button></div>`:""}`}
function picker(){return `<div class="card"><h2>Escolhe o teu número</h2><div class="mut">Cada aluno usa um número de 1 a 24. Diz ao professor qual escolheste.</div><div class="bar">${[...Array(24)].map((_,i)=>`<button onclick="S.user=${i+1};draw()">${i+1}</button>`).join("")}</div></div><div style="text-align:center;margin-top:10px"><button onclick="S.teach=true;draw()">Sou o professor: ver classificação</button></div>`}
function panel(){return `<div class="card"><h2>Classificação da turma</h2><div class="mut">Cola aqui os códigos dos alunos, um por linha (por exemplo U3:1520).</div><textarea id="codes" rows="6" style="width:100%;margin-top:8px;font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px"></textarea><div class="bar"><button class="pri" onclick="rankCodes()">Ver classificação</button><button onclick="S.teach=false;draw()">Voltar</button></div><div id="rk" style="margin-top:8px"></div></div>`}
function rankCodes(){const m=[...document.getElementById("codes").value.matchAll(/U\s*(\d{1,2})\s*[:=]\s*(-?\d+)/gi)];const a=m.map(x=>({u:+x[1],v:+x[2]})).sort((x,y)=>y.v-x.v);document.getElementById("rk").innerHTML=a.map((x,i)=>`<div class="row"><div class="nm">${i+1}. Utilizador ${x.u}</div><b class="${x.v>=START?"up":"dn"}">${f(x.v)}</b></div>`).join("")||'<div class="mut">Nenhum código válido.</div>'}
init();draw();
</script>
</body>
</html>
